[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interlock-model-checker"
version = "0.1.0"
description = "Bounded four-version model checking for asynchronous merge interactions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
interlock = "interlock.cli:main"

[tool.setuptools.packages.find]
include = ["interlock*"]

[tool.setuptools.package-data]
"interlock.fixtures.historical_waitfor" = ["LICENSE", "manifest.json"]
